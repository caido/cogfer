[package]
name = "llmwire"
version = "0.1.0"
authors = ["caido <info@caido.io>"]
description = "A Rust library for calling language-model APIs"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/caido/llmwire"
readme = "README.md"

[lib]
name = "llmwire"
path = "src/lib.rs"

[features]
default = ["reqwest-transport", "aws"]
# AWS SigV4 request signing for Amazon Bedrock.
aws = ["dep:ring"]
reqwest-transport = ["dep:async-stream", "dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
async-stream = { version = "0.3", optional = true }
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["rustls-no-provider", "stream"] }
# SHA-256 and HMAC for SigV4; the same crate Rustls already brings in.
ring = { version = "0.17", optional = true }
# Reqwest leaves provider selection to the process. Keep this compatible with
# reqwest's Rustls version so install_default_crypto_provider installs ring
# into, and ReqwestTransport::new checks, the same process-wide slot without
# pulling AWS-LC.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio = { version = "1.49", optional = true, default-features = false, features = ["time"] }

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "io-util", "sync", "net"] }

[[example]]
name = "generate"
required-features = ["reqwest-transport"]

[[example]]
name = "stream"
required-features = ["reqwest-transport"]

[[example]]
name = "structured_output"
required-features = ["reqwest-transport"]

[[example]]
name = "reasoning"
required-features = ["reqwest-transport"]

[[example]]
name = "agentic_loop"
required-features = ["reqwest-transport"]

[[example]]
name = "openai_compatible"
required-features = ["reqwest-transport"]

[[example]]
name = "error_handling"
required-features = ["reqwest-transport"]

[[example]]
name = "chatgpt_login"
required-features = ["reqwest-transport"]

[[example]]
name = "xai_login"
required-features = ["reqwest-transport"]

[[example]]
name = "bedrock"
required-features = ["reqwest-transport", "aws"]
