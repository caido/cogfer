[package]
name = "caido-ai"
version = "0.1.0"
authors = ["caido <info@caido.io>"]
description = "A Rust library for calling language-model APIs"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = ["reqwest-transport"]
reqwest-transport = ["dep:pin-project-lite", "dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
pin-project-lite = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["rustls-no-provider", "stream"] }
# Reqwest leaves provider selection to the process. Keep this compatible with
# reqwest's Rustls version so ReqwestTransport::new can install ring into the
# same crate instance without pulling AWS-LC.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio = { version = "1.49", optional = true, default-features = false, features = ["time"] }

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "io-util", "sync", "net"] }

[[example]]
name = "generate"
required-features = ["reqwest-transport"]

[[example]]
name = "stream"
required-features = ["reqwest-transport"]

[[example]]
name = "structured_output"
required-features = ["reqwest-transport"]

[[example]]
name = "reasoning"
required-features = ["reqwest-transport"]

[[example]]
name = "agentic_loop"
required-features = ["reqwest-transport"]

[[example]]
name = "openai_compatible"
required-features = ["reqwest-transport"]

[[example]]
name = "error_handling"
required-features = ["reqwest-transport"]

[[example]]
name = "chatgpt_login"
required-features = ["reqwest-transport"]

[[example]]
name = "xai_login"
required-features = ["reqwest-transport"]
