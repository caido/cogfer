[package]
name = "llmwire"
version = "0.1.0"
authors = ["caido <info@caido.io>"]
description = "🤖 Multi-provider LLM client"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/caido/llmwire"
readme = "README.md"
exclude = [".github/", "mise.toml", "rust-toolchain.toml", "tests/"]

[lib]
name = "llmwire"
path = "src/lib.rs"

[features]
default = ["reqwest-transport", "aws"]
aws = [
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-smithy-eventstream",
    "dep:aws-smithy-types",
]
reqwest-transport = ["dep:async-stream", "dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
async-stream = { version = "0.3", optional = true }
async-trait = "0.1"
aws-smithy-eventstream = { version = "0.61", optional = true }
aws-smithy-types = { version = "1.6", optional = true }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
log = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-core = { path = "vendor/sse-core", version = "=0.2.3", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio = { version = "1.49", optional = true, default-features = false, features = ["time"] }
aws-sigv4 = { version = ">=1.4, <1.5", optional = true }
aws-credential-types = { version = ">=1.2, <1.3", optional = true }

[dev-dependencies]
dotenvy = "0.15"
hex = "0.4"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "io-util", "sync", "net"] }

[[example]]
name = "generate"
required-features = ["reqwest-transport"]

[[example]]
name = "stream"
required-features = ["reqwest-transport"]

[[example]]
name = "structured_output"
required-features = ["reqwest-transport"]

[[example]]
name = "reasoning"
required-features = ["reqwest-transport"]

[[example]]
name = "agentic_loop"
required-features = ["reqwest-transport"]

[[example]]
name = "openai_compatible"
required-features = ["reqwest-transport"]

[[example]]
name = "error_handling"
required-features = ["reqwest-transport"]

[[example]]
name = "chatgpt_login"
required-features = ["reqwest-transport"]

[[example]]
name = "xai_login"
required-features = ["reqwest-transport"]

[[example]]
name = "bedrock"
required-features = ["reqwest-transport", "aws"]
